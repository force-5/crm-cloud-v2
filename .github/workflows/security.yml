name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * 1"   # weekly Monday 3am UTC
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Two jobs, deliberately (same as admin-cloud-v2): the blocking secret scan can fail the workflow
# without ever skipping the report-only scanners.
jobs:

  # Secret scanning — BLOCKING. A committed credential must be rotated, so failing is the correct
  # response. Uses the gitleaks BINARY (MIT), pinned and SHA256-verified; the gitleaks-action
  # wrapper needs a paid organisation licence.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: a secret committed and later "removed" is still in the git objects.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt.
          # Bump both together.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # --redact keeps any finding's value out of the build log, which anyone with repo access can read.
      - name: gitleaks secret scan
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: warn
          retention-days: 400    # SOC 2 audit window

  # Dependency and SAST scanning — REPORT-ONLY. Never blocks; publishes artifacts.
  scanners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Trivy filesystem scan (dependencies via pnpm-lock.yaml, plus secrets). Pinned to an immutable
      # commit (v0.36.0) after the March 2026 trivy-action tag hijack; the same pin as admin-cloud-v2.
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-fs.txt
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-fs-report
          path: trivy-fs.txt
          if-no-files-found: warn
          retention-days: 400

      # Semgrep SAST — free, no GitHub Advanced Security needed. Report-only.
      - name: Semgrep SAST scan
        continue-on-error: true
        run: |
          pipx run semgrep scan --config p/default --config p/secrets --config p/typescript \
            --sarif --output semgrep.sarif --metrics off || true

      - name: Upload Semgrep Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 400

      # npm advisory audit of production dependencies: the Node equivalent of admin's weekly OWASP
      # Dependency Check, and fast enough to run on every push. Report-only.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - name: pnpm audit (production dependencies)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high > pnpm-audit.txt 2>&1 || true

      - name: Upload pnpm audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pnpm-audit-report
          path: pnpm-audit.txt
          if-no-files-found: warn
          retention-days: 400

      - name: Print scan summary
        if: always()
        run: |
          echo "===== Trivy Filesystem ====="; cat trivy-fs.txt 2>/dev/null || echo "(no FS report)"
          echo "===== pnpm audit ====="; cat pnpm-audit.txt 2>/dev/null || echo "(no audit report)"
