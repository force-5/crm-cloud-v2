# Elastic Beanstalk (Node.js on AL2023) nginx overrides — included in the http block.
#
# Image uploads (account logo, sign-in background, profile photo) are base64 data URLs in a JSON body.
# The BFF accepts up to 8 MB on those routes; nginx's default is 1 MB, so it would reject them with a
# 413 before the BFF could return a useful error. 10 MB leaves headroom for the JSON wrapper.
client_max_body_size 10M;

# Publishing an account provisions a whole tenant in VMS and can take a while; the BFF's own VMS
# timeout is 20s, so nginx must not give up first.
proxy_read_timeout 60s;
proxy_send_timeout 60s;
